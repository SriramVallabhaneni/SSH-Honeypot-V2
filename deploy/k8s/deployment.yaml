apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-honeypot
  namespace: ssh-honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ssh-honeypot
  template:
    metadata:
      labels:
        app: ssh-honeypot
    spec:
      containers:
        - name: ssh-honeypot
          image: ssh-honeypot:local
          imagePullPolicy: Never
          ports:
            - containerPort: 2222
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"