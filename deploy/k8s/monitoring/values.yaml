alertmanager:
  enabled: false

prometheus:
  service:
    type: NodePort
    nodePort: 30090

  prometheusSpec:
    retention: 2d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

grafana:
  service:
    type: NodePort
    nodePort: 30300

  persistence:
    enabled: true
    size: 1Gi

  adminPassword: "change-me"

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true