prometheus:
  service:
    type: NodePort
    nodePort: 30090

  prometheusSpec:
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

grafana:
  service:
    type: NodePort
    nodePort: 30300

  persistence:
    enabled: true
    size: 2Gi

  adminPassword: "change-me"

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true